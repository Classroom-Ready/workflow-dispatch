name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# dist/index.js is a published artifact rather than a PR deliverable: the deploy job
# rebuilds it from the merged tree and pushes it back on every master push, so a PR that
# only moves yarn.lock is expected to carry a bundle built from the older dependency set
# and no check compares the committed bundle against a fresh build. Every job that
# exercises dist rebuilds it first, so CI tests the bytes deploy will publish.

# The self-tests dispatch fixture workflows in THIS repo. workflow_dispatch and
# repository_dispatch are the documented exceptions to the "GITHUB_TOKEN can't trigger
# workflows" rule, so the built-in token works here and no PERSONAL_TOKEN secret is needed.
# (Consumers dispatching into a DIFFERENT repo still need a PAT or GitHub App token.)
# actions: write covers createWorkflowDispatch plus reading the triggered run's status/logs.
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Whether the live-dispatch self-tests below can run at all. They call
    # createWorkflowDispatch against this repo, which needs a GITHUB_TOKEN carrying
    # actions: write, and two kinds of pull_request run never get one:
    #   - a PR from a fork, where the token is read-only;
    #   - a PR opened by Dependabot, whose runs get a read-only token and no secrets
    #     even though the branch lives in this repo.
    # Those runs are limited to build + lint + test, which needs nothing but the
    # checkout. push and workflow_dispatch always run the full suite.
    outputs:
      self-tests: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Enable Corepack
      run: corepack enable
    - name: Build
      run: |
        yarn install --immutable
        yarn build
    - name: Lint
      run: yarn lint
    - name: Test
      run: yarn test
    - name: Archive dist
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: dist

  # Every self-test below passes `ref: ${{ github.head_ref || github.ref }}`. The action
  # otherwise defaults the dispatch ref to github.context.ref, which on a pull_request is
  # refs/pull/<n>/merge - not a branch or tag, so the dispatch API rejects it. head_ref is
  # the PR's source branch and is empty on push and workflow_dispatch, where github.ref is
  # the branch being built.
  echo-1-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "echo-1-test [trigger|by workflow name]"
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Invoke echo 1 workflow using this action (do not wait for completion)
      uses: ./
      with:
        workflow: Message Echo 1
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}
        inputs: '{"message": "blah blah"}'
        wait-for-completion: false

  echo-2-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "echo-2-test [trigger|by workflow filename]"
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Invoke echo 2 workflow using this action
      uses: ./
      with:
        workflow: echo-2.yaml
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}
        wait-for-completion: false

    # - name: Invoke echo 1 workflow by id
    #   uses: ./
    #   with:
    #     workflow: '1854247'
    #     token: ${{ secrets.PERSONAL_TOKEN }}
    #     inputs: '{"message": "Mango jam"}'
    #     wait-for-completion: false

  long-running-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "long-running-test [trigger+wait|by workflow filename|shoud succeed]"
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Invoke 'long-running' workflow and wait for result using this action
      id: long-running-workflow
      uses: ./
      with:
        workflow: long-running.yml
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}
        wait-for-completion-interval: 10s
        wait-for-completion-timeout: 5m
        display-workflow-run-url-interval: 10s
        display-workflow-run-url-timeout: 5m
      continue-on-error: true
    - uses: nick-fields/assert-action@v4
      with:
        expected: success
        actual: ${{ steps.long-running-workflow.outputs.workflow-conclusion }}
    - uses: nick-fields/assert-action@v4
      with:
        expected: success
        actual: ${{ steps.long-running-workflow.outcome }}

  failing-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "failing-test [trigger+wait|by workflow filename|should report failure]"
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Invoke 'failing' workflow and wait for result using this action
      id: failing-workflow
      uses: ./
      with:
        workflow: failing.yml
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}
        wait-for-completion-interval: 10s
        wait-for-completion-timeout: 60s
        display-workflow-run-url-interval: 10s
        display-workflow-run-url-timeout: 60s
      continue-on-error: true
    - run: echo "worflow-conclusion=${{ steps.failing-workflow.outputs.workflow-conclusion }}"
    - uses: nick-fields/assert-action@v4
      with:
        expected: failure
        actual: ${{ steps.failing-workflow.outputs.workflow-conclusion }}
    - uses: nick-fields/assert-action@v4
      with:
        expected: failure
        actual: ${{ steps.failing-workflow.outcome }}
    # The fixture's ::error:: text has to survive the round trip into this job - that is what
    # lets a caller read the cause on the triggering run.
    - uses: nick-fields/assert-action@v4
      with:
        comparison: contains
        expected: 'the failing fixture stopped on purpose'
        actual: ${{ steps.failing-workflow.outputs.workflow-failure-reason }}
    - uses: nick-fields/assert-action@v4
      with:
        comparison: contains
        expected: 'echo'
        actual: ${{ steps.failing-workflow.outputs.workflow-failure-reason }}

  timeout-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "timeout-test [trigger+wait|by workflow filename|should report timed_out]"
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Invoke 'timeout' workflow and wait for result using this action
      id: timeout-workflow
      uses: ./
      with:
        workflow: timeout.yml
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}
        wait-for-completion-interval: 10s
        wait-for-completion-timeout: 30s
        display-workflow-run-url-interval: 10s
        display-workflow-run-url-timeout: 30s
      continue-on-error: true
    - uses: nick-fields/assert-action@v4
      with:
        expected: timed_out
        actual: ${{ steps.timeout-workflow.outputs.workflow-conclusion }}
    - uses: nick-fields/assert-action@v4
      with:
        expected: failure
        actual: ${{ steps.timeout-workflow.outcome }}

  print-workflow-logs-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "print-workflow-logs-test [trigger+wait|by workflow filename|print logs|should report timed_out]"
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Invoke 'retrieve-logs' workflow and wait for result using this action
      id: print-workflow-logs
      uses: ./
      with:
        workflow: retrieve-logs.yml
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}
        wait-for-completion-interval: 10s
        wait-for-completion-timeout: 120s
        display-workflow-run-url-interval: 10s
        display-workflow-run-url-timeout: 120s
        workflow-logs: print
      continue-on-error: true
    - uses: nick-fields/assert-action@v4
      with:
        expected: timed_out
        actual: ${{ steps.print-workflow-logs.outputs.workflow-conclusion }}
    - uses: nick-fields/assert-action@v4
      with:
        expected: failure
        actual: ${{ steps.print-workflow-logs.outcome }}
      # TODO: add assertions on logs

    # - name: Invoke external workflow using this action
    #   uses: ./
    #   with:
    #     workflow: Deploy To Kubernetes
    #     repo: benc-uk/dapr-store
    #     token: ${{ secrets.PERSONAL_TOKEN }}
    #     ref: master

  parallel-runs-test:
    needs: [build]
    if: needs.build.outputs.self-tests == 'true'
    runs-on: ubuntu-latest
    name: "parallel-runs-test [trigger+wait|by workflow filename|should succeed]"
    strategy:
      fail-fast: false
      matrix:
        environment:
          - trunk
          - staging
    env:
      RUN_NAME: ${{ github.repository }}/actions/runs/${{ github.run_id }}/envs/${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist
      - name: Invoke 'named-run' workflow for this environment and wait for result using this action
        id: named-run-workflow
        uses: ./
        with:
          workflow: named-run.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}
          run-name: ${{ env.RUN_NAME }}
          wait-for-completion-interval: 10s
          wait-for-completion-timeout: 120s
          display-workflow-run-url-interval: 10s
          display-workflow-run-url-timeout: 120s
          workflow-logs: json-output
          inputs: >-
            {
              "run-name": "${{ env.RUN_NAME }}",
              "environment": "${{ matrix.environment }}"
            }
        continue-on-error: true
      - uses: nick-fields/assert-action@v4
        with:
          expected: success
          actual: ${{ steps.named-run-workflow.outputs.workflow-conclusion }}
      - uses: nick-fields/assert-action@v4
        with:
          expected: success
          actual: ${{ steps.named-run-workflow.outcome }}
      - uses: nick-fields/assert-action@v4
        env:
          EXPECTED_LOG_MESSAGE: "### Env: ${{ matrix.environment }} ###"
        with:
          expected: true
          actual: ${{ contains(fromJson(steps.named-run-workflow.outputs.workflow-logs).echo.*.message, env.EXPECTED_LOG_MESSAGE) }}

  deploy:
    needs:
      - echo-1-test
      - echo-2-test
      - long-running-test
      - failing-test
      - timeout-test
      - print-workflow-logs-test
      - parallel-runs-test
    # Publishing runs off master (or a manual dispatch) only - a pull_request run must
    # never push a commit, and its token has no contents: write to do it with.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pushes the rebuilt dist back to the repo, so it needs write on top of the
    # workflow-level read default.
    permissions:
      contents: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    # Commits the rebuilt dist back to the branch that ran, and is a no-op when dist
    # matches what is already committed. Push auth comes from the token
    # actions/checkout persists in the local git config (persist-credentials
    # defaults to true), so no third-party code runs under contents: write.
    - name: Update repo with build
      env:
        TARGET_REF: ${{ github.ref }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A dist
        if git diff --cached --quiet -- dist; then
          echo "dist matches ${SOURCE_SHA} - nothing to publish"
          exit 0
        fi
        git commit -m "Automated publish: dist for ${SOURCE_SHA}"
        git push origin "HEAD:${TARGET_REF}"

